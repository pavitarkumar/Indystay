<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="45%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Inner Ambient Glow Border -->
  <rect x="14" y="14" width="484" height="484" rx="106" fill="none" stroke="url(#glowGrad)" stroke-width="5" />

  <!-- Stylized Heritage Architecture & 'I' Monogram Emblem -->
  <g filter="url(#shadow)" transform="translate(96, 75)">
    <!-- Palace Arch Outer Structure -->
    <path d="M 160 35 C 225 35 265 80 265 145 L 265 295 C 265 305 257 312 247 312 L 225 312 C 215 312 207 305 207 295 L 207 165 C 207 125 185 96 160 96 C 135 96 113 125 113 165 L 113 295 C 113 305 105 312 95 312 L 73 312 C 63 312 55 305 55 295 L 55 145 C 55 80 95 35 160 35 Z" fill="#FFFFFF" />

    <!-- Central Regal Pillar / 'I' Spine -->
    <path d="M 142 145 L 178 145 C 184 145 190 151 190 157 L 190 312 L 130 312 L 130 157 C 130 151 136 145 142 145 Z" fill="url(#goldGrad)" />

    <!-- Foundation Pedestal -->
    <rect x="35" y="322" width="250" height="26" rx="13" fill="#FFFFFF" />
    <rect x="15" y="354" width="290" height="18" rx="9" fill="url(#goldGrad)" />

    <!-- 4-point Luxury Star at Crown -->
    <path d="M 160 -5 Q 160 22 174 22 Q 160 22 160 48 Q 160 22 146 22 Q 160 22 160 -5 Z" fill="url(#goldGrad)" />
  </g>
</svg>
